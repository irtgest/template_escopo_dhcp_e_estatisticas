zabbix_export:
  version: '6.0'
  date: '2021-11-21T21:30:45Z'
  groups:
    -
      uuid: 9ac3b316b76d4e24b19c34d959559f03
      name: 'HSC Hosts'
  templates:
    -
      uuid: c5d012ff79964f0482aeab643d80f5fb
      template: 'HSC Discovery DHCP scopes - HSC'
      name: 'HSC Discovery DHCP scopes - HSC'
      description: |
        ## Обзор

        Этот шаблон подготовлен для мониторинга областей DHCP серверов Microsoft Windows (PT-BR).

        Оповещение, если служба DHCP не выполняется.
        Предупреждение, если свободных адресов в области меньше {$DHCP.FREE.WARN}.
        Критическое событие, если свободных адресов в области меньше {$DHCP.FREE.CRIT}.

        ## Автор

        Основовано на community шаблоне William Normandia (template_escopo_dhcp_e_estatisticas)
      groups:
        -
          name: 'HSC Hosts'
      macros:
        -
          macro: '{$DHCP.FREE.WARN}'
          value: '20'
          description: 'Порог предупреждения: число свободных адресов в области DHCP меньше этого значения.'
        -
          macro: '{$DHCP.FREE.CRIT}'
          value: '5'
          description: 'Критический порог: число свободных адресов в области DHCP меньше этого значения.'
      items:
        -
          uuid: e9ec53768d4947029ff2126e7fba4ee7
          name: parDhcpTotalNoOfDiscovers
          type: SNMP_AGENT
          snmp_oid: enterprises.311.1.3.1.2.0
          key: 1.3.6.1.4.1.311.1.3.1.2
          delay: '60'
          history: 7d
          tags:
            -
              tag: Application
              value: DHCP
        -
          uuid: b0cfed7e1cff4689be6bf7792a09864c
          name: parDhcpTotalNoOfRequests
          type: SNMP_AGENT
          snmp_oid: enterprises.311.1.3.1.3.0
          key: 1.3.6.1.4.1.311.1.3.1.3
          delay: '60'
          history: 7d
          tags:
            -
              tag: Application
              value: DHCP
        -
          uuid: f197939dec884f5cbb4a4462ffeb6326
          name: parDhcpTotalNoOfReleases
          type: SNMP_AGENT
          snmp_oid: enterprises.311.1.3.1.4.0
          key: 1.3.6.1.4.1.311.1.3.1.4
          delay: '60'
          history: 7d
          tags:
            -
              tag: Application
              value: DHCP
        -
          uuid: b581ed2043fb465ea5411990a097af68
          name: parDhcpTotalNoOfOffers
          type: SNMP_AGENT
          snmp_oid: enterprises.311.1.3.1.5.0
          key: 1.3.6.1.4.1.311.1.3.1.5
          delay: '60'
          history: 7d
          tags:
            -
              tag: Application
              value: DHCP
        -
          uuid: 515314f1ce1349f5b49791110aa01373
          name: parDhcpTotalNoOfAcks
          type: SNMP_AGENT
          snmp_oid: enterprises.311.1.3.1.6.0
          key: 1.3.6.1.4.1.311.1.3.1.6
          delay: '60'
          history: 7d
          tags:
            -
              tag: Application
              value: DHCP
        -
          uuid: d3daeb06ea124d01a7596dd0e170e31f
          name: parDhcpTotalNoOfNacks
          type: SNMP_AGENT
          snmp_oid: enterprises.311.1.3.1.7.0
          key: 1.3.6.1.4.1.311.1.3.1.7
          delay: '60'
          history: 7d
          tags:
            -
              tag: Application
              value: DHCP
        -
          uuid: 8da577fed3d040a9982d1ed90dd24967
          name: parDhcpTotalNoOfDeclines
          type: SNMP_AGENT
          snmp_oid: enterprises.311.1.3.1.8.0
          key: 1.3.6.1.4.1.311.1.3.1.8
          delay: '60'
          history: 7d
          tags:
            -
              tag: Application
              value: DHCP
        -
          uuid: 3f15ca2cdcdf48689b9911962c53015d
          name: 'Статус сервиса DHCP'
          key: 'service.info[DHCPServer]'
          delay: '60'
          history: 7d
          description: |
            0 - выполняется,
            1 - приостановлена,
            2 - ожидание запуска,
            3 - ожидание приостановки,
            4 - ожидание продолжения,
            5 - ожидание остановки,
            6 - остановлена,
            7 - неизвестно,
            255 - служба неизвестна
          tags:
            -
              tag: Application
              value: DHCP
          triggers:
            -
              uuid: 1231b33065ca45fdb4b385fca90e70ed
              expression: 'last(/HSC Discovery DHCP scopes - HSC/service.info[DHCPServer])<>0'
              name: 'Служба DHCP на {HOST.NAME} не выполняется'
              priority: HIGH
              description: 'Триггер срабатывает, если статус службы DHCPServer не равен 0 (служба не выполняется).'
      discovery_rules:
        -
          uuid: 127c5cabaf2f447fad5b2c2abeb7f49b
          name: 'DHCP scopes'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IPSCOPE},SNMPv2-SMI::enterprises.311.1.3.2.1.1.1,{#IPINUSE},SNMPv2-SMI::enterprises.311.1.3.2.1.1.2,{#IPFREE},SNMPv2-SMI::enterprises.311.1.3.2.1.1.3]'
          key: dhcp.scope
          delay: '60'
          item_prototypes:
            -
              uuid: 61447d0b70484af79842fd14854d1126
              name: 'Количество свободных адресов в области {#IPSCOPE}'
              type: SNMP_AGENT
              snmp_oid: 'SNMPv2-SMI::enterprises.311.1.3.2.1.1.3.{#IPSCOPE}'
              key: 'ipfree[{#IPSCOPE}]'
              delay: '60'
              history: 7d
              tags:
                -
                  tag: Application
                  value: 'DHCP scopes'
              trigger_prototypes:
                -
                  uuid: 7c818712e6d648568d9cf6c2096c93d5
                  expression: 'last(/HSC Discovery DHCP scopes - HSC/ipfree[{#IPSCOPE}])<{$DHCP.FREE.CRIT}'
                  name: 'Критически мало свободных адресов в области {#IPSCOPE} = {ITEM.VALUE}.'
                  priority: HIGH
                  description: 'Триггер срабатывает, если число свободных адресов в области меньше {$DHCP.FREE.CRIT}.'
                -
                  uuid: 9b2e4f17c8a64d0e91f3a6b5c7d8e0f1
                  expression: 'last(/HSC Discovery DHCP scopes - HSC/ipfree[{#IPSCOPE}])<{$DHCP.FREE.WARN}'
                  name: 'Мало свободных адресов в области {#IPSCOPE} = {ITEM.VALUE}.'
                  priority: WARNING
                  description: 'Триггер срабатывает, если число свободных адресов в области меньше {$DHCP.FREE.WARN}.'
                  dependencies:
                    -
                      name: 'Критически мало свободных адресов в области {#IPSCOPE} = {ITEM.VALUE}.'
                      expression: 'last(/HSC Discovery DHCP scopes - HSC/ipfree[{#IPSCOPE}])<{$DHCP.FREE.CRIT}'
            -
              uuid: 7e49033f92ed4cf28bbc8ff539b51ca4
              name: 'Количество используемых адресов в области {#IPSCOPE}'
              type: SNMP_AGENT
              snmp_oid: 'SNMPv2-SMI::enterprises.311.1.3.2.1.1.2.{#IPSCOPE}'
              key: 'ipuse[{#IPSCOPE}]'
              delay: '60'
              history: 7d
              tags:
                -
                  tag: Application
                  value: 'DHCP scopes'
